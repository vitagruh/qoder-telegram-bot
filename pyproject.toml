[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "venv"]

[tool.ruff.lint]
# Консервативный набор: ошибки синтаксиса/импортов и неопределённые имена.
# Дополнительные правила можно включать постепенно.
select = ["E4", "E7", "E9", "F"]
